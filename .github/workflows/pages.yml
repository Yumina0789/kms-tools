name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_API_URL: https://kms.ikxin.com
      NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      NODE_VERSION: '22'
      NITRO_PRESET: static
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: ikxin/kms-tools
          ref: main
          fetch-depth: 1

      - name: 准备 pnpm
        # 不写 version：上游 package.json 已声明 packageManager: pnpm@11.22.0，
        # 两处同时指定会让 pnpm/action-setup 报 Multiple versions of pnpm specified
        uses: pnpm/action-setup@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 环境自检
        run: |
          node -v
          pnpm -v

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态生成（nuxt generate）
        run: pnpm run generate

      - name: 补 .nojekyll 并检查产物
        run: |
          touch .output/public/.nojekyll
          ls -la .output/public | head -30
          du -sh .output/public

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
